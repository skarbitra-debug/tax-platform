# ============================================================
# CI: checks — frozen install, Prisma, lint, typecheck, all unit tests, build.
# Отдельный db-tests — PostgreSQL, migrations/seed, integration и E2E.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # заглушка: prisma validate резолвит env("DATABASE_URL"), сама БД не нужна
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # версия pnpm берётся из package.json#packageManager (11.10.0)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @tax/db exec prisma validate

      - name: Prisma generate
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # vitest сам определяет CI и выполняет одиночный прогон (не watch)
      - name: Unit tests (all packages except DB integration)
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_build
          AUTH_SECRET: ci-build-only-not-a-real-secret-000000000000
          APP_URL: http://127.0.0.1:3000
          AUTH_TRUST_HOST: "true"
          PILOT_NOINDEX: "1"
          NEXT_TELEMETRY_DISABLED: "1"

  # ---- Тесты с БД: интеграционные (@tax/core против Postgres) + e2e воронки ----
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tax
          POSTGRES_PASSWORD: tax
          POSTGRES_DB: tax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tax -d tax"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://tax:tax@localhost:5432/tax
      # значения для seed и запуска web в e2e
      ADMIN_EMAIL: admin@example.com
      ADMIN_INITIAL_PASSWORD: ci-admin-pass
      AUTH_SECRET: ci-secret-at-least-32-characters-long!!
      E2E_SYNTHETIC_AUTH_SECRET: ci-secret-at-least-32-characters-long!!
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3000
      PILOT_NOINDEX: "1"
      SEED_DEV: "1"
      E2E_WEBSERVER: "1"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Migrate + seed (SEED_DEV)
        run: pnpm db:deploy && pnpm db:seed
      - name: Integration tests (@tax/core против БД)
        run: pnpm --filter @tax/integration-tests test
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E воронки (Playwright поднимает web сам)
        run: pnpm e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
