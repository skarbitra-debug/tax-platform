# DEV: только Postgres — приложения запускаются на хосте ради HMR (pnpm dev)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tax}
      POSTGRES_DB: ${POSTGRES_DB:-tax}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
